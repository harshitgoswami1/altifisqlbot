[project]
name = "sqlagentbackend"
version = "0.1.0"
description = "Streaming FastAPI backend for the PostgreSQL bond agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
